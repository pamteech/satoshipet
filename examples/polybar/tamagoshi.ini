; Módulo do polybar (Linux). Inclua em modules-right = tamagoshi
[module/tamagoshi]
type = custom/script
exec = curl -s --max-time 2 http://127.0.0.1:8737/status.txt || echo "🥚 offline"
interval = 30
click-left = curl -s http://127.0.0.1:8737/status | jq -r .frase | xargs -0 notify-send "Tamagoshi"
