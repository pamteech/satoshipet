[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satoshipet"
version = "1.5.0"
description = "A pixel-art crypto pet that floats on your desktop (or lives in your terminal) and reacts to the market."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pamella Soares" }]
requires-python = ">=3.9"
keywords = ["crypto", "bitcoin", "virtual-pet", "pixel-art", "desktop-pet", "tui", "tkinter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Environment :: X11 Applications",
  "Environment :: Console",
  "Topic :: Games/Entertainment",
]
dependencies = ["requests>=2.32", "Pillow>=10.3"]

[project.optional-dependencies]
secure = ["keyring>=24"]
tray = ["pystray>=0.19; sys_platform == 'win32' or sys_platform == 'darwin'"]
dev = ["pytest>=7"]
build = ["pyinstaller>=6"]

[project.scripts]
satoshipet = "satoshipet.cli:main"
tamagoshi = "satoshipet.cli:main"  # apelido do nome antigo (deprecado), some numa versão futura

[project.urls]
Homepage = "https://github.com/pamteech/satoshipet"
Issues = "https://github.com/pamteech/satoshipet/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
satoshipet = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py39"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "PIE", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003", "SIM108", "B008", "UP035", "UP006", "UP007", "UP045", "RUF005", "SIM105", "B905", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011", "SIM", "B023", "E702", "E501", "B017", "RUF059", "E731"]
"tools/*" = ["E402"]
"src/satoshipet/api.py" = ["E501"]  # HTML/JS embutido
"src/satoshipet/sprites.py" = ["E702"]  # DSL de pixel art: 1 traço por linha, de propósito

[tool.coverage.run]
source = ["satoshipet"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
warn_unused_ignores = true
files = [
    "src/satoshipet/genetica.py", "src/satoshipet/batalha.py", "src/satoshipet/hardcore.py",
    "src/satoshipet/papel.py", "src/satoshipet/loja.py", "src/satoshipet/multichain.py",
    "src/satoshipet/config.py", "src/satoshipet/logic.py", "src/satoshipet/evolucao.py",
    "src/satoshipet/conquistas.py", "src/satoshipet/license.py", "src/satoshipet/baleias.py",
    "src/satoshipet/noticias.py", "src/satoshipet/pixel.py", "src/satoshipet/i18n.py",
    "src/satoshipet/ui.py", "src/satoshipet/ajustes.py",
]

# núcleo de regras do jogo: tudo tipado, sem desculpa 🧐
[[tool.mypy.overrides]]
module = [
    "satoshipet.batalha", "satoshipet.hardcore", "satoshipet.papel", "satoshipet.loja",
    "satoshipet.multichain", "satoshipet.config", "satoshipet.logic", "satoshipet.evolucao",
    "satoshipet.conquistas", "satoshipet.license", "satoshipet.baleias", "satoshipet.noticias",
    "satoshipet.genetica",
]
disallow_untyped_defs = true
