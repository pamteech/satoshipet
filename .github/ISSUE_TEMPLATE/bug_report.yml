name: 🐛 Bug report
description: The pet is sick (and not because of the market)
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened?, description: "Steps, expected vs actual" }
    validations: { required: true }
  - type: dropdown
    attributes:
      label: OS
      options: [Windows, macOS (Apple Silicon), macOS (Intel), Linux]
    validations: { required: true }
  - type: dropdown
    attributes:
      label: Mode
      options: [Desktop window, Terminal (--tui), Built .exe/.app]
  - type: input
    attributes: { label: "Version (`tamagoshi --version`)" }
  - type: textarea
    attributes: { label: Logs / screenshot, render: shell }
