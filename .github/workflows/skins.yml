# Concurso de skins: valida as skins tocadas no PR e publica um preview (PNG + GIF) como artifact.
name: Skin contest check
on:
  pull_request:
    paths: ["src/satoshipet/assets/skins/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Skins alteradas
        id: skins
        run: |
          DIRS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- src/satoshipet/assets/skins \
                 | cut -d/ -f1-5 | sort -u | while read d; do [ -d "$d" ] && echo "$d"; done | tr '\n' ' ')
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"
          echo "skins: $DIRS"
      - name: Validar + preview
        if: steps.skins.outputs.dirs != ''
        run: python tools/validate_skin.py ${{ steps.skins.outputs.dirs }} --preview previews
      - name: Resumo no PR
        if: always() && steps.skins.outputs.dirs != ''
        run: |
          echo "## 🐣 Concurso de skins" >> "$GITHUB_STEP_SUMMARY"
          cat previews/RELATORIO.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "Baixe o artifact **skin-preview** pra ver o PNG/GIF ampliado." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.skins.outputs.dirs != ''
        with:
          name: skin-preview
          path: previews/
