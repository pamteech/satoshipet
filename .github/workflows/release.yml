name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: SatoshiPet-windows
          - os: macos-latest
            artifact: SatoshiPet-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows .exe
        if: runner.os == 'Windows'
        shell: cmd
        env:
          SATOSHIPET_LICENSE_SECRET: ${{ secrets.SATOSHIPET_LICENSE_SECRET }}
        run: tools\build_windows.bat
      - name: Build macOS .app
        if: runner.os == 'macOS'
        env:
          SATOSHIPET_LICENSE_SECRET: ${{ secrets.SATOSHIPET_LICENSE_SECRET }}
        run: |
          ./tools/build_mac.sh
          cd dist && ditto -c -k --keepParent "SatoshiPet.app" SatoshiPet-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
