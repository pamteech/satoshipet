# Build de TESTE (manual): gera só o .dmg do macOS (Apple Silicon) como artifact.
# Não cria release nem tag. Sem SATOSHIPET_LICENSE_SECRET -> usa o segredo de dev (chaves de dev).
name: Test build (macOS)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "macos-latest (arm64) ou macos-15-intel (x86_64)"
        default: macos-latest

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build .app
        run: ./tools/build_mac.sh
      - name: Empacotar .dmg
        run: |
          mkdir -p dmgsrc && cp -R "dist/SatoshiPet.app" dmgsrc/ && ln -s /Applications dmgsrc/Applications
          DMG=dist/SatoshiPet-macos-$(uname -m).dmg
          for i in 1 2 3 4 5; do hdiutil create -volname "SatoshiPet" -srcfolder dmgsrc -ov -format UDZO "$DMG" && break; echo "hdiutil ocupado, tentando de novo ($i)"; sleep 5; done
          test -f "$DMG"
          file "dist/SatoshiPet.app/Contents/MacOS/SatoshiPet"
          codesign -dv "dist/SatoshiPet.app" 2>&1 || true
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: SatoshiPet-macos-${{ inputs.runner }}
          path: dist/*.dmg
          retention-days: 7
